<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoChat</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat версии для работы прямо из HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .pulse-record { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .crown-glow {
            display: inline-block;
            transition: all 0.25s ease-in-out;
        }
        .crown-glow:hover {
            filter: drop-shadow(0 0 6px #fbbf24) drop-shadow(0 0 12px #f59e0b);
            transform: scale(1.3) rotate(-8deg);
            cursor: pointer;
        }
    </style>
</head>
<body class="h-screen w-screen bg-[#0f172a] text-slate-200 overflow-hidden flex items-center justify-center p-0 sm:p-4">

    <!-- МОДАЛКА АВТОРИЗАЦИИ / ВХОДА -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto bg-indigo-500 rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-rocket text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Вход в CosmoChat</h2>
                <p class="text-sm text-slate-400 mt-1">Введите данные для входа или регистрации</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="text" id="authName" placeholder="Ваше имя (для регистрации)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500">
                
                <div class="relative">
                    <span class="absolute left-4 top-3 text-slate-500">@</span>
                    <input type="text" id="authUsername" placeholder="username (необязательно)" oninput="hideAuthError()" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-4 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500">
                </div>
                
                <input type="text" id="authPhone" required placeholder="+7 (___) ___-__-__" oninput="applyPhoneMask(this)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500">
                
                <div class="relative">
                    <input type="password" id="authPassword" required placeholder="Пароль" oninput="hideAuthError()" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500">
                    <button type="button" onclick="togglePasswordVisibility('authPassword', this)" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300 transition-colors">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div id="authError" class="text-xs text-red-400 text-center hidden font-medium"></div>

                <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 rounded-xl transition-colors mt-2">
                    Продолжить
                </button>

                <button type="button" onclick="resetAllData()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium py-2.5 rounded-xl transition-colors text-xs border border-red-500/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Очистить базу (Админ)
                </button>
            </form>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
    <div id="profileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center text-3xl mb-4 text-indigo-400 shadow-lg">
                    <i class="fa-solid fa-user-pen"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Настройки профиля</h2>
                <p id="profileCooldownText" class="text-xs text-slate-400 mt-1">Смена данных доступна раз в 24 часа</p>
            </div>

            <form onsubmit="handleUpdateProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Имя</label>
                    <input type="text" id="editName" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
                </div>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-slate-500">@</span>
                        <input type="text" id="editUsername" required oninput="hideProfileError()" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Новый пароль (оставьте пустым, если не меняете)</label>
                    <div class="relative">
                        <input type="password" id="editPassword" oninput="hideProfileError()" placeholder="Новый пароль" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-4 pr-10 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
                        <button type="button" onclick="togglePasswordVisibility('editPassword', this)" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300 transition-colors">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div id="profileError" class="text-xs text-red-400 text-center hidden font-medium leading-relaxed"></div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeProfileModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl transition-colors text-sm font-medium">Отмена</button>
                    <button type="submit" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-3 rounded-xl transition-colors text-sm font-medium shadow-lg shadow-indigo-500/20">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ИНТЕРФЕЙС -->
    <div id="mainApp" class="w-full h-full max-w-[1400px] sm:rounded-2xl flex overflow-hidden bg-slate-900 border border-slate-700 shadow-2xl hidden">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="w-full sm:w-[350px] border-r border-slate-700 flex flex-col bg-slate-900 shrink-0">
            <div class="p-4 border-b border-slate-700 flex items-center justify-between bg-slate-800/50">
                <div class="flex items-center gap-3">
                    <div id="myAvatar" class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white shrink-0"></div>
                    <div class="min-w-0 flex flex-col justify-center">
                        <div id="myName" class="text-sm font-bold text-white truncate flex items-center gap-1"></div>
                        <div id="myUsername" class="text-xs text-slate-400 truncate"></div>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="openProfileModal()" class="text-slate-400 hover:text-indigo-400 p-2 transition-colors" title="Настройки профиля">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2 transition-colors" title="Выйти">
                        <i class="fa-solid fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="p-3">
                <div class="relative flex items-center bg-slate-800 rounded-xl border border-slate-700 focus-within:border-indigo-500 transition-colors">
                    <i class="fa-solid fa-search absolute left-3 text-slate-400 text-sm"></i>
                    <input type="text" id="globalSearch" placeholder="Поиск людей..." oninput="handleGlobalSearch(this.value)" class="w-full bg-transparent pl-9 pr-8 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none">
                    <button id="clearSearchBtn" onclick="clearGlobalSearch()" class="absolute right-3 text-slate-400 hover:text-white hidden">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
            </div>

            <div id="sidebarList" class="flex-1 overflow-y-auto"></div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="flex-1 flex flex-col bg-[#0b1121] relative">
            
            <div id="chatHeader" class="h-[73px] border-b border-slate-700 flex items-center px-6 bg-slate-900 hidden justify-between">
                <div class="flex items-center gap-4">
                    <div id="chatAvatar" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white"></div>
                    <div>
                        <div id="chatName" class="text-base font-semibold text-white flex items-center gap-1"></div>
                        <div id="chatInfo" class="text-xs text-slate-400"></div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="adminChatActions" class="hidden items-center">
                        <button id="muteBtn" onclick="toggleMuteActiveUser()" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5"></button>
                    </div>
                    <div class="relative hidden sm:block">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                        <input type="text" placeholder="Поиск в чате..." oninput="renderMessages(this.value)" class="bg-slate-800 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500 w-48">
                    </div>
                </div>
            </div>

            <div id="emptyChatState" class="flex-1 flex flex-col items-center justify-center text-slate-500">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-regular fa-comments text-3xl"></i>
                </div>
                <p>Выберите чат для начала общения</p>
            </div>

            <div id="messagesArea" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 hidden"></div>

            <div id="inputArea" class="p-4 bg-slate-900 border-t border-slate-700 hidden">
                <div id="mutedBanner" class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-center text-xs text-red-400 font-medium hidden">
                    <i class="fa-solid fa-volume-xmark mr-1"></i> Вы замучены администратором и не можете отправлять сообщения.
                </div>

                <div id="inputControlsWrapper" class="max-w-4xl mx-auto flex items-end gap-2 relative">
                    <div id="textInputWrapper" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-1 flex items-center focus-within:border-indigo-500">
                        <textarea id="msgInput" rows="1" placeholder="Введите сообщение..." onkeydown="handleEnter(event)" class="w-full bg-transparent resize-none outline-none text-white px-3 py-2 text-sm max-h-32 min-h-[40px]"></textarea>
                    </div>

                    <div id="voiceRecordWrapper" class="flex-1 bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-2 hidden items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full bg-red-500 pulse-record"></div>
                            <span id="recordTimer" class="text-sm font-mono text-red-400">00:00</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="cancelVoice()" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded bg-slate-800">Отмена</button>
                            <button onclick="sendVoice()" class="text-xs text-white px-3 py-1.5 rounded bg-red-500 hover:bg-red-600">Отправить</button>
                        </div>
                    </div>

                    <button id="micBtn" onclick="startVoice()" class="p-3 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-xl transition-colors shrink-0">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    
                    <button onclick="sendTextMsg()" class="p-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl shadow-lg shrink-0 transition-colors">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyApifDrGuoHFtdU1ZZtPRUWvkFgjMFyCEY",
            authDomain: "ya-zadolbalcya.firebaseapp.com",
            databaseURL: "https://ya-zadolbalcya-default-rtdb.firebaseio.com",
            projectId: "ya-zadolbalcya",
            storageBucket: "ya-zadolbalcya.firebasestorage.app",
            messagingSenderId: "736550801988",
            appId: "1:736550801988:web:69815bbb50bb799b296211",
            measurementId: "G-ZEPE6548CN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let activeChatUserId = null;
        let allUsersMap = {};
        let allMessagesList = [];
        
        let mediaRecorder = null;
        let audioChunks = [];
        let recordInterval = null;
        let recordTime = 0;

        function cleanDigits(str) {
            let digits = (str || '').replace(/\D/g, '');
            return digits.length > 10 ? digits.slice(-10) : digits;
        }

        function isAdmin(phone) {
            return cleanDigits(phone) === '9254699801';
        }

        function normalizeStr(str) {
            return (str || '').toString().toLowerCase().replace(/[\s\(\)\-\+@]/g, '');
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Подписка на обновление пользователей в Realtime Database
            db.ref('users').on('value', (snapshot) => {
                allUsersMap = snapshot.val() || {};
                
                if (currentUser) {
                    if (allUsersMap[currentUser.id]) {
                        currentUser = allUsersMap[currentUser.id];
                        localStorage.setItem('cosmo_currentUser', JSON.stringify(currentUser));
                        updateHeaderInfo();
                        checkUserMuteState();
                    }
                }
                
                if (activeChatUserId && allUsersMap[activeChatUserId]) {
                    const activePartner = allUsersMap[activeChatUserId];
                    updateAdminMuteButton(activePartner);
                    const isUserAdmin = isAdmin(activePartner.phone);
                    const muteBadge = activePartner.isMuted ? ' <span class="text-red-400 text-xs" title="Замучен">🔇</span>' : '';
                    document.getElementById('chatName').innerHTML = `${activePartner.name} ${isUserAdmin ? '<span class="crown-glow text-amber-400 text-sm" title="Администратор">👑</span>' : ''}${muteBadge}`;
                }

                const searchVal = document.getElementById('globalSearch').value;
                if (!searchVal) renderRecentChats();
                else handleGlobalSearch(searchVal);
            });

            // Подписка на обновление сообщений в Realtime Database
            db.ref('messages').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                allMessagesList = Object.values(data);
                
                if (activeChatUserId) {
                    renderMessages();
                }
                const searchVal = document.getElementById('globalSearch').value;
                if (!searchVal) renderRecentChats();
            });

            // Восстановление локальной сессии аккаунта
            const savedUser = JSON.parse(localStorage.getItem('cosmo_currentUser') || 'null');
            if (savedUser) {
                currentUser = savedUser;
                showMainApp();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        });

        function hideAuthError() {
            document.getElementById('authError').classList.add('hidden');
        }

        function hideProfileError() {
            document.getElementById('profileError').classList.add('hidden');
        }

        function applyPhoneMask(input) {
            let matrix = "+7 (___) ___-__-__", i = 0,
                def = matrix.replace(/\D/g, ""), val = input.value.replace(/\D/g, "");
            if (def.length >= val.length) val = def;
            input.value = matrix.replace(/./g, function(a) {
                return /[_\d]/.test(a) && i < val.length ? val.charAt(i++) : i >= val.length ? "" : a
            });
            hideAuthError();
        }

        async function resetAllData() {
            if (currentUser && isAdmin(currentUser.phone)) {
                if (confirm("Вы вошли как Администратор. Вы уверены, что хотите полностью очистить ОБЛАЧНУЮ базу данных?")) {
                    await db.ref().remove();
                    localStorage.clear();
                    location.reload();
                }
                return;
            }

            const phone = prompt("Внимание! Эту операцию может выполнить только администратор.\nВведите номер телефона администратора:");
            if (!phone) return;

            if (!isAdmin(phone)) {
                alert("Ошибка: Указанный номер не принадлежит администратору!");
                return;
            }

            const users = Object.values(allUsersMap);
            const adminUser = users.find(u => isAdmin(u.phone));

            if (adminUser && adminUser.password) {
                const pass = prompt("Введите пароль администратора:");
                if (pass !== adminUser.password) {
                    alert("Ошибка: Неверный пароль администратора!");
                    return;
                }
            }

            if (confirm("Доступ подтвержден. Вы действительно хотите полностью очистить всю базу данных в облаке?")) {
                await db.ref().remove();
                localStorage.clear();
                location.reload();
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('authName').value.trim();
            let userTag = document.getElementById('authUsername').value.trim();
            const rawPhone = document.getElementById('authPhone').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            const phoneDigits = cleanDigits(rawPhone);
            if (phoneDigits.length < 10) {
                errorDiv.innerText = "Введите корректный номер телефона";
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!password || password.length < 4) {
                errorDiv.innerText = "Пароль должен быть не менее 4 символов";
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!name) {
                errorDiv.innerText = "Введите ваше имя для регистрации";
                errorDiv.classList.remove('hidden');
                return;
            }

            const usersList = Object.values(allUsersMap);

            // Проверка на дубликат номера телефона
            let existingUser = usersList.find(u => cleanDigits(u.phone) === phoneDigits);
            if (existingUser) {
                errorDiv.innerText = "Пользователь с таким номером телефона уже зарегистрирован!";
                errorDiv.classList.remove('hidden');
                return;
            }

            // Проверка на дубликат username
            if (!userTag) {
                userTag = 'user_' + Math.floor(Math.random() * 90000 + 10000);
            } else {
                let existingTagUser = usersList.find(u => normalizeStr(u.username) === normalizeStr(userTag));
                if (existingTagUser) {
                    errorDiv.innerText = "Имя пользователя (@username) уже занято!";
                    errorDiv.classList.remove('hidden');
                    return;
                }
            }

            // Регистрация нового аккаунта
            currentUser = { 
                id: 'usr_' + Date.now(), 
                name, 
                username: userTag, 
                phone: rawPhone,
                password: password,
                isMuted: false,
                lastProfileChange: 0 
            };

            // Запись в облачную базу Firebase
            await db.ref('users/' + currentUser.id).set(currentUser);
            localStorage.setItem('cosmo_currentUser', JSON.stringify(currentUser));
            
            errorDiv.classList.add('hidden');
            document.getElementById('authModal').classList.add('hidden');
            showMainApp();
        }

        function openProfileModal() {
            document.getElementById('editName').value = currentUser.name;
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editPassword').value = '';
            document.getElementById('profileError').classList.add('hidden');
            
            const isAdm = isAdmin(currentUser.phone);
            const cooldownDesc = document.getElementById('profileCooldownText');
            if (isAdm) {
                cooldownDesc.innerText = "👑 Режим Администратора: кулдаун отключен";
                cooldownDesc.className = "text-xs text-amber-400 mt-1 font-semibold";
            } else {
                cooldownDesc.innerText = "Смена данных доступна раз в 24 часа";
                cooldownDesc.className = "text-xs text-slate-400 mt-1";
            }

            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const newName = document.getElementById('editName').value.trim();
            const newUserTag = document.getElementById('editUsername').value.trim();
            const newPassword = document.getElementById('editPassword').value.trim();
            const errorDiv = document.getElementById('profileError');

            const isAdm = isAdmin(currentUser.phone);

            if (!isAdm) {
                const now = Date.now();
                const cooldownTime = 24 * 60 * 60 * 1000;
                const lastChange = currentUser.lastProfileChange || 0;
                const timePassed = now - lastChange;
                
                if (timePassed < cooldownTime) {
                    const timeLeft = cooldownTime - timePassed;
                    const leftH = Math.floor(timeLeft / (1000 * 60 * 60));
                    const leftM = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const leftS = Math.floor((timeLeft % (1000 * 60)) / 1000);

                    errorDiv.innerText = `Слишком часто! Изменять данные можно раз в день. Осталось ждать: ${leftH} ч. ${leftM} мин. ${leftS} сек.`;
                    errorDiv.classList.remove('hidden');
                    return;
                }
            }

            if (newPassword && newPassword.length < 4) {
                errorDiv.innerText = "Новый пароль должен содержать минимум 4 символа";
                errorDiv.classList.remove('hidden');
                return;
            }

            const usersList = Object.values(allUsersMap);
            let existingTagUser = usersList.find(u => normalizeStr(u.username) === normalizeStr(newUserTag) && u.id !== currentUser.id);
            if (existingTagUser) {
                errorDiv.innerText = "Имя пользователя (username) уже занято другим аккаунтом";
                errorDiv.classList.remove('hidden');
                return;
            }

            currentUser.name = newName;
            currentUser.username = newUserTag;
            if (newPassword) currentUser.password = newPassword;
            currentUser.lastProfileChange = Date.now();

            await db.ref('users/' + currentUser.id).set(currentUser);
            localStorage.setItem('cosmo_currentUser', JSON.stringify(currentUser));

            updateHeaderInfo();
            closeProfileModal();
        }

        function updateHeaderInfo() {
            const isAdm = isAdmin(currentUser.phone);
            const nameContainer = document.getElementById('myName');
            const muteBadge = currentUser.isMuted ? ' <span class="text-red-400 text-xs" title="Замучен">🔇</span>' : '';
            
            nameContainer.innerHTML = `${currentUser.name} ${isAdm ? '<span class="crown-glow text-amber-400 text-xs" title="Администратор">👑</span>' : ''}${muteBadge}`;
            document.getElementById('myUsername').innerText = '@' + currentUser.username;
            document.getElementById('myAvatar').innerText = currentUser.name ? currentUser.name[0].toUpperCase() : '?';
        }

        function logout() {
            localStorage.removeItem('cosmo_currentUser');
            location.reload();
        }

        function showMainApp() {
            document.getElementById('mainApp').classList.remove('hidden');
            updateHeaderInfo();
            checkUserMuteState();
            renderRecentChats();
        }

        function checkUserMuteState() {
            const inputControls = document.getElementById('inputControlsWrapper');
            const mutedBanner = document.getElementById('mutedBanner');
            
            if (currentUser && currentUser.isMuted) {
                if (inputControls) inputControls.classList.add('hidden');
                if (mutedBanner) mutedBanner.classList.remove('hidden');
            } else {
                if (inputControls) inputControls.classList.remove('hidden');
                if (mutedBanner) mutedBanner.classList.add('hidden');
            }
        }

        function handleGlobalSearch(query) {
            const clearBtn = document.getElementById('clearSearchBtn');
            const cleanQuery = normalizeStr(query);

            if (!cleanQuery) {
                clearBtn.classList.add('hidden');
                renderRecentChats();
                return;
            }

            clearBtn.classList.remove('hidden');
            const usersList = Object.values(allUsersMap);

            let matches = usersList.filter(u => {
                if (u.id === currentUser.id) return false;
                return normalizeStr(u.name).includes(cleanQuery) || 
                       normalizeStr(u.username).includes(cleanQuery) || 
                       normalizeStr(u.phone).includes(cleanQuery);
            });

            renderSidebarList(matches, true);
        }

        function clearGlobalSearch() {
            document.getElementById('globalSearch').value = '';
            handleGlobalSearch('');
        }

        function renderRecentChats() {
            if (document.getElementById('globalSearch').value.trim() !== '') return; 
            
            const partnerIds = new Set();
            allMessagesList.forEach(m => {
                if (m.senderId === currentUser.id) partnerIds.add(m.receiverId);
                if (m.receiverId === currentUser.id) partnerIds.add(m.senderId);
            });

            const usersList = Object.values(allUsersMap);
            const recentUsers = usersList.filter(u => partnerIds.has(u.id));
            renderSidebarList(recentUsers, false);
        }

        function renderSidebarList(usersList, isSearchResult) {
            const container = document.getElementById('sidebarList');
            container.innerHTML = '';

            if (usersList.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-sm text-slate-500">${isSearchResult ? 'Пользователь не найден' : 'Нет активных диалогов.<br>Найдите кого-нибудь через поиск.'}</div>`;
                return;
            }

            usersList.forEach(user => {
                const div = document.createElement('div');
                const isActive = activeChatUserId === user.id;
                const isUserAdmin = isAdmin(user.phone);
                const muteBadge = user.isMuted ? '<span class="text-red-400 text-xs ml-auto" title="Замучен">🔇</span>' : '';
                
                div.className = `flex items-center gap-3 p-3 mx-2 mt-1 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-indigo-600' : 'hover:bg-slate-800'}`;
                
                div.innerHTML = `
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg text-white shrink-0 ${isActive ? 'bg-white/20' : 'bg-slate-700'}">
                        ${user.name ? user.name[0].toUpperCase() : '?'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-semibold text-white truncate flex items-center gap-1">
                            ${user.name} ${isUserAdmin ? '<span class="crown-glow text-amber-400 text-xs" title="Администратор">👑</span>' : ''}
                        </div>
                        <div class="text-xs ${isActive ? 'text-indigo-200' : 'text-slate-400'} truncate">@${user.username}</div>
                    </div>
                    ${muteBadge}
                `;
                
                div.onclick = () => openChat(user);
                container.appendChild(div);
            });
        }

        function updateAdminMuteButton(targetUser) {
            const adminActions = document.getElementById('adminChatActions');
            if (!adminActions) return;
            
            if (isAdmin(currentUser.phone) && targetUser.id !== currentUser.id) {
                adminActions.classList.remove('hidden');
                adminActions.classList.add('flex');
                const muteBtn = document.getElementById('muteBtn');
                if (targetUser.isMuted) {
                    muteBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 transition-colors flex items-center gap-1.5";
                    muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Размутить';
                } else {
                    muteBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 transition-colors flex items-center gap-1.5";
                    muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Замутить';
                }
            } else {
                adminActions.classList.add('hidden');
                adminActions.classList.remove('flex');
            }
        }

        async function toggleMuteActiveUser() {
            if (!isAdmin(currentUser.phone) || !activeChatUserId) return;
            let targetUser = allUsersMap[activeChatUserId];
            if (!targetUser) return;

            targetUser.isMuted = !targetUser.isMuted;
            await db.ref('users/' + targetUser.id).set(targetUser);
        }

        function openChat(user) {
            activeChatUserId = user.id;
            
            document.getElementById('emptyChatState').classList.add('hidden');
            document.getElementById('chatHeader').classList.remove('hidden');
            document.getElementById('messagesArea').classList.remove('hidden');
            document.getElementById('inputArea').classList.remove('hidden');
            
            const isUserAdmin = isAdmin(user.phone);
            const muteBadge = user.isMuted ? ' <span class="text-red-400 text-xs" title="Замучен">🔇</span>' : '';
            document.getElementById('chatName').innerHTML = `${user.name} ${isUserAdmin ? '<span class="crown-glow text-amber-400 text-sm" title="Администратор">👑</span>' : ''}${muteBadge}`;
            document.getElementById('chatInfo').innerText = `@${user.username} • ${user.phone}`;
            document.getElementById('chatAvatar').innerText = user.name ? user.name[0].toUpperCase() : '?';

            updateAdminMuteButton(user);
            checkUserMuteState();

            clearGlobalSearch();
            renderMessages();
        }

        function renderMessages(filterQuery = '') {
            if (!activeChatUserId) return;
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';

            let chatMsgs = allMessagesList.filter(m => 
                (m.senderId === currentUser.id && m.receiverId === activeChatUserId) ||
                (m.senderId === activeChatUserId && m.receiverId === currentUser.id)
            );

            if (filterQuery) {
                chatMsgs = chatMsgs.filter(m => m.type === 'text' && m.text.toLowerCase().includes(filterQuery.toLowerCase()));
            }

            if (chatMsgs.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-sm mt-10">История сообщений пуста</div>`;
                return;
            }

            chatMsgs.forEach(msg => {
                const isMe = msg.senderId === currentUser.id;
                const div = document.createElement('div');
                div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                const time = new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let content = '';
                if (msg.type === 'voice') {
                    content = `<audio controls class="h-10 mt-1"><source src="${msg.audioUrl}" type="audio/webm"></audio>`;
                } else {
                    const safeText = (msg.text || '').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g, "<br>");
                    content = `<div class="text-sm break-words">${safeText}</div>`;
                }

                div.innerHTML = `
                    <div class="max-w-[75%] rounded-2xl px-4 py-2 relative group ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-slate-800 text-slate-200 rounded-bl-sm border border-slate-700'}">
                        ${content}
                        <div class="text-[10px] text-right mt-1 opacity-60">${time}</div>
                    </div>
                `;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTextMsg();
            }
            e.target.style.height = 'auto';
            e.target.style.height = (e.target.scrollHeight) + 'px';
        }

        function sendTextMsg() {
            if (currentUser.isMuted) {
                alert("Вы замучены администратором и не можете отправлять сообщения.");
                return;
            }

            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !activeChatUserId) return;

            saveMessage({ type: 'text', text: text });
            
            input.value = '';
            input.style.height = 'auto'; 
        }

        async function saveMessage(msgData) {
            const msgId = 'msg_' + Date.now();
            const messageObj = {
                id: msgId,
                senderId: currentUser.id,
                receiverId: activeChatUserId,
                time: new Date().toISOString(),
                ...msgData
            };
            
            await db.ref('messages/' + msgId).set(messageObj);
        }

        async function startVoice() {
            if (currentUser.isMuted) {
                alert("Вы замучены администратором и не можете отправлять голосовые сообщения.");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.start();

                document.getElementById('textInputWrapper').classList.add('hidden');
                document.getElementById('micBtn').classList.add('hidden');
                document.getElementById('voiceRecordWrapper').classList.remove('hidden');
                document.getElementById('voiceRecordWrapper').classList.add('flex');

                recordTime = 0;
                document.getElementById('recordTimer').innerText = '00:00';
                recordInterval = setInterval(() => {
                    recordTime++;
                    const m = String(Math.floor(recordTime / 60)).padStart(2, '0');
                    const s = String(recordTime % 60).padStart(2, '0');
                    document.getElementById('recordTimer').innerText = `${m}:${s}`;
                }, 1000);
            } catch (err) {
                alert("Нет доступа к микрофону");
            }
        }

        function stopMicrophone() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            clearInterval(recordInterval);
            document.getElementById('textInputWrapper').classList.remove('hidden');
            document.getElementById('micBtn').classList.remove('hidden');
            document.getElementById('voiceRecordWrapper').classList.add('hidden');
            document.getElementById('voiceRecordWrapper').classList.remove('flex');
        }

        function cancelVoice() {
            stopMicrophone();
            audioChunks = [];
        }

        function sendVoice() {
            if (!mediaRecorder) return;
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => saveMessage({ type: 'voice', audioUrl: reader.result });
            };
            stopMicrophone();
        }
    </script>
</body>
</html>
